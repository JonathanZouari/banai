<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" /><!-- the share link carries a token -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BanAI · מעצב ארונות</title>
    <link rel="icon" type="image/png" href="/src/assets/banai-mark.png" />
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <!-- Hebrew is the default; ui/i18n.js rewrites every data-i18n text when the language changes. -->
    <a class="skip-link" href="#properties-panel" data-i18n="app.skipLink">דילוג למאפיינים</a>
    <header class="topbar">
      <h1 class="topbar__title" id="topbar-logo" data-i18n-aria="app.logoLabel" aria-label="BanAI מעצב ארונות"></h1>
      <span id="view-switch-slot"></span>
      <div class="topbar__actions">
        <label class="toggle">
          <input type="checkbox" id="toggle-interior" />
          <span data-i18n="app.showInterior">הצגת פנים הארון</span>
        </label>
        <span id="unit-selector"></span>
        <button type="button" class="btn btn--tonal" id="open-render" data-testid="open-render" data-i18n="app.render">הדמיה</button>
        <button type="button" class="btn btn--primary" id="open-save" data-testid="open-save" data-i18n="app.save">שמירה</button>
        <button type="button" class="btn btn--primary" id="open-review" data-testid="open-review" data-i18n="review.open">לסיכום ושליחה</button>
        <button type="button" class="icon-btn" id="open-tour" data-testid="open-tour"></button>
        <span id="ui-language-slot"></span>
        <a class="btn btn--ghost" href="/accessibility.html" lang="he" data-testid="a11y-link">נגישות</a>
      </div>
    </header>
    <div class="banner banner--error" id="error-banner" role="alert" hidden></div>
    <main class="workspace">
      <aside class="panel" id="chat-panel" lang="he" data-i18n-aria="app.chatLabel" aria-label="מעצב AI"></aside>
      <section class="viewer" id="viewer" data-i18n-aria="app.viewerLabel" aria-label="תצוגת תלת-ממד של הארון"></section>
      <aside class="panel panel--properties" id="properties-panel" data-i18n-aria="app.propertiesLabel" aria-label="מאפיינים" tabindex="-1">
        <h2 class="panel__title" data-i18n="app.propertiesTitle">מאפיינים</h2>
        <p class="panel__hint" data-i18n="app.propertiesHint">בחרו חלק בתצוגת התלת-ממד, או ברשימת "כל החלקים" למטה, כדי לערוך אותו.</p>
        <div id="properties-content"></div>
      </aside>
      <!-- Room fit view: the photo with the wardrobe layer, and the room panel (stage 4, ADR-008). -->
      <section class="room-stage" id="room-stage" data-i18n-aria="room.title" aria-label="התאמה לחדר" hidden></section>
      <aside class="panel panel--properties panel--room" id="room-panel" data-i18n-aria="room.title" aria-label="התאמה לחדר" tabindex="-1" hidden></aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
