<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><title>BanAI intro film</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="film"></canvas>
<script type="module">
import { createFilm, CUTS } from './film.js';
const q = new URLSearchParams(location.search);
const film = createFilm(document.getElementById('film'), { width: +(q.get('w') ?? 1280), height: +(q.get('h') ?? 720), pixelRatio: +(q.get('ss') ?? 1) });
window.film = { ...film, CUTS };
if (q.has('play')) { const t0 = performance.now(); const tick = () => { film.renderAt(q.get('play'), ((performance.now() - t0) / 1000) % CUTS[q.get('play')]); requestAnimationFrame(tick); }; tick(); }
</script></body></html>
